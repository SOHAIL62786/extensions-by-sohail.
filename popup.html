<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automation Tool</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="column">
    <h1>Home</h1>

    <section class="card">
      <table>
        <thead>
          <tr>
            <th class="sno">S.No</th>
            <th class="finone">Finone</th>
            <th>Name</th>
            <th class="actions"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" hidden>No entries yet</p>
    </section>

    <form id="addForm" autocomplete="off">
      <input id="finOneInput" type="text" inputmode="numeric" placeholder="Finone" aria-label="Finone">
      <input id="nameInput" type="text" placeholder="Name" aria-label="Name">
      <button type="submit" class="primary">Add</button>
    </form>
    <p id="message" role="alert"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
