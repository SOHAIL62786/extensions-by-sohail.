<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automation Tool</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="main">
    <header><h1>Home</h1></header>

    <main>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th class="sno">S.No</th>
              <th class="finone">Finone</th>
              <th>Name</th>
              <th class="action"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" hidden>No entries yet</p>
      </div>

      <form id="addForm" autocomplete="off">
        <input id="finOneInput" type="text" inputmode="numeric" placeholder="Finone" aria-label="Finone">
        <input id="nameInput" type="text" placeholder="Name" aria-label="Name">
        <button type="submit">Add</button>
        <span id="message" role="alert"></span>
      </form>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
