<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automation Tool</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <nav class="tabs">
    <button type="button" class="tab active" data-page="home">Home</button>
    <button type="button" class="tab" data-page="search">Search Data</button>
    <button type="button" class="tab" data-page="menu">Menu List</button>
  </nav>

  <div id="page-home" class="page">
  <main class="column">
    <h1>Team Data</h1>

    <section class="card">
      <table>
        <thead>
          <tr>
            <th class="sno">S.No</th>
            <th class="finone">Finone</th>
            <th>Name</th>
            <th class="actions"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" hidden>No entries yet</p>
    </section>

    <form id="addForm" autocomplete="off">
      <input id="finOneInput" type="text" inputmode="numeric" placeholder="Finone" aria-label="Finone">
      <input id="nameInput" type="text" placeholder="Name" aria-label="Name">
      <button type="submit" class="primary">Add</button>
    </form>
    <p id="message" role="alert"></p>
  </main>

  <aside class="column info">
    <h1>Extension &amp; Device</h1>
    <section class="card">
      <h2>Extension</h2>
      <dl id="extensionInfo"></dl>
      <h2>Device</h2>
      <dl id="deviceInfo"></dl>
    </section>
  </aside>
  </div>

  <div id="page-search" class="page" hidden>
  <main class="column wide">
    <h1>Search Data</h1>
    <section class="card">
      <table>
        <thead>
          <tr>
            <th class="sno">S.No</th>
            <th>Mobile number</th>
            <th class="count">Searches</th>
            <th>Password</th>
            <th>Last searched</th>
            <th class="actions"></th>
          </tr>
        </thead>
        <tbody id="searchRows"></tbody>
      </table>
      <p id="searchEmpty" hidden>No numbers searched yet</p>
    </section>
  </main>
  </div>

  <div id="page-menu" class="page" hidden>
  <main class="column wide">
    <h1>Menu List</h1>
    <section class="card">
      <table>
        <thead>
          <tr>
            <th class="sno">S.No</th>
            <th>Menu name</th>
            <th class="group">Shown in</th>
            <th class="actions"></th>
          </tr>
        </thead>
        <tbody id="menuRows"></tbody>
      </table>
      <p id="menuEmpty" hidden>No menu items yet</p>
    </section>
    <form id="menuForm" autocomplete="off">
      <input id="menuNameInput" type="text" placeholder="Menu name" aria-label="Menu name">
      <select id="menuGroupInput" aria-label="Shown in"></select>
      <button type="submit" class="primary">Add</button>
    </form>
    <p id="menuMessage" class="message" role="alert"></p>
  </main>
  </div>

  <script src="menuDefaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
